version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-models:/app/models
    environment:
      - DATABASE_URL=sqlite:///./skin_cancer.db
      - SECRET_KEY=${SECRET_KEY:-changeme123}
    depends_on:
      - ml_model
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - app-network

  ml_model:
    build:
      context: ./ml
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ml-models:/models
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  backend-models:
  ml-models:
